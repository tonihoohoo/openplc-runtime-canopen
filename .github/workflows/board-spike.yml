name: Board spike

on:
  push:
    branches: [feature/canopen-add-canopen-slave-esp32]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: TWAI in QEMU on vcan (${{ matrix.v.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        v:
          - { name: icount-1, flags: "", qemu: "-m 4M -icount shift=3,align=off,sleep=on" }
          - { name: icount-2, flags: "", qemu: "-m 4M -icount shift=3,align=off,sleep=on" }
          - { name: icount-3, flags: "", qemu: "-m 4M -icount shift=3,align=off,sleep=on" }
          - { name: icount-4, flags: "", qemu: "-m 4M -icount shift=3,align=off,sleep=on" }
          - { name: icount-5, flags: "", qemu: "-m 4M -icount shift=3,align=off,sleep=on" }
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: vcan0
        run: .github/scripts/vcan-up.sh vcan0

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/qemu
          key: board-spike-v1

      - name: arduino-cli and ESP32 core
        run: |
          start=$(date +%s)
          curl -fsSL https://github.com/arduino/arduino-cli/releases/download/v1.3.1/arduino-cli_1.3.1_Linux_64bit.tar.gz | sudo tar xz -C /usr/local/bin arduino-cli
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list
          echo "core setup $(( $(date +%s) - start )) s"

      - name: QEMU
        run: |
          start=$(date +%s)
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libslirp0 can-utils
          if [ ! -x ~/qemu/bin/qemu-system-xtensa ]; then
            url=$(curl -fsSL https://raw.githubusercontent.com/espressif/esp-idf/master/tools/tools.json | python3 -c "
          import json, sys
          tools = json.load(sys.stdin)['tools']
          t = next(t for t in tools if t['name'] == 'qemu-xtensa')
          print(t['versions'][0]['linux-amd64']['url'])")
            echo "QEMU $url"
            mkdir -p ~/qemu-dl && curl -fsSL "$url" | tar xJ -C ~/qemu-dl
            rm -rf ~/qemu && mv ~/qemu-dl/qemu ~/qemu
          fi
          ~/qemu/bin/qemu-system-xtensa --version
          ~/qemu/bin/qemu-system-xtensa -machine esp32 -device help 2>&1 | grep -i -n "can\|twai" || true
          echo "qemu setup $(( $(date +%s) - start )) s"

      - name: Build sketch
        run: |
          start=$(date +%s)
          arduino-cli compile --build-property "compiler.cpp.extra_flags=${{ matrix.v.flags }}" --fqbn esp32:esp32:esp32:FlashMode=dio --export-binaries --output-dir build .github/board-spike/spike
          ls -la build
          echo "compile $(( $(date +%s) - start )) s"

      - name: Run in QEMU and check
        timeout-minutes: 5
        run: |
          img=build/spike.ino.merged.bin
          cp "$img" flash.bin
          truncate -s 4M flash.bin
          candump -t d vcan0 > candump.log 2>&1 &
          cpid=$!
          timeout 90 python3 .github/board-spike/check.py vcan0 > check.log 2>&1 &
          kpid=$!
          sleep 0.5
          ~/qemu/bin/qemu-system-xtensa -nographic -machine esp32 \
            -drive file=flash.bin,if=mtd,format=raw \
            -object can-bus,id=canbus0 \
            -object can-host-socketcan,id=canhost0,if=vcan0,canbus=canbus0 \
            -global driver=esp32.twai,property=canbus,value=canbus0 \
            ${{ matrix.v.qemu }} -serial file:serial.log -monitor none &
          qpid=$!
          set +e
          wait $kpid
          rc=$?
          kill $qpid $cpid
          cat check.log
          echo "--- serial"; tail -40 serial.log
          echo "--- candump (head)"; head -20 candump.log
          a2l=$(ls ~/.arduino15/packages/esp32/tools/esp-x32/*/bin/xtensa-esp32-elf-addr2line | head -1)
          bt=$(grep -o '0x4[0-9a-f]\{7\}' serial.log | sort -u | tr '\n' ' ')
          if [ -n "$bt" ]; then echo "--- addr2line"; "$a2l" -pfiaC -e build/spike.ino.elf $bt; fi
          exit $rc

  board:
    name: Board slave built by the editor
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      EDITOR_REPOSITORY: tonihoohoo/openplc-editor-canopen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPOSITORY }}
          ref: feature/canopen-add-canopen-slave-esp32
          path: editor

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: vcan
        run: |
          .github/scripts/vcan-up.sh vcan0
          .github/scripts/vcan-up.sh vcan1

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/qemu
          key: board-qemu-v1

      - name: QEMU
        run: .github/board-slave/qemu-install.sh

      - name: Build the editor
        working-directory: editor
        run: |
          start=$(date +%s)
          npm ci --ignore-scripts
          npm run setup:strucpp
          node node_modules/electron/install.js
          npm run build:main -- --no-optimization-minimize --no-devtool --no-optimization-concatenate-modules
          mkdir -p release/app/dist/main/node_modules
          ln -sfn "$PWD/node_modules/strucpp" release/app/dist/main/node_modules/strucpp
          mkdir -p "$RUNNER_TEMP/editor-data/User/Runtime"
          echo '[]' > "$RUNNER_TEMP/editor-data/User/Runtime/arduino-core-control.json"
          echo '[]' > "$RUNNER_TEMP/editor-data/User/Runtime/arduino-library-control.json"
          echo "editor build $(( $(date +%s) - start )) s"

      - name: Board package
        working-directory: editor
        run: |
          curl -fsSL https://api.autonomylogic.com/vpp-catalog/v1/catalog.json -o catalog.json
          url=$(python3 - <<'PY'
          import json
          c = json.load(open('catalog.json'))
          found = []
          def walk(x):
              if isinstance(x, dict):
                  if 'packageId' in x:
                      found.append(x)
                  for v in x.values():
                      walk(v)
              elif isinstance(x, list):
                  for v in x:
                      walk(v)
          walk(c)
          p = next(p for p in found if 'espressif' in p['packageId'])
          v = p.get('versions', [p])[0]
          print(v.get('downloadUrl') or v.get('url'))
          PY
          )
          curl -fsSL "$url" -o esp.vpp
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli packages install esp.vpp \
            --user-data "$RUNNER_TEMP/editor-data" --json

      - name: Compile the board slave
        working-directory: editor
        run: |
          set -o pipefail
          start=$(date +%s)
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli compile \
            ./e2e/fixtures/canopen-slave-board/project --target "ESP32 Generic" \
            --user-data "$RUNNER_TEMP/editor-data" > compile.log 2>&1 || {
            echo "--- first errors"; grep -n -m 8 -B 2 -A 8 ': error:\|fatal error:' compile.log | cut -c 1-400 | head -150
            echo "--- tail"; tail -30 compile.log; exit 1; }
          tail -30 compile.log
          echo "compile $(( $(date +%s) - start )) s"
          od=$(find / -name canopen_slave_od.h -newer catalog.json -not -path '*/editor/resources/*' 2>/dev/null | head -1)
          bin=$(find / -name "*.merged.bin" -newer catalog.json 2>/dev/null | head -1)
          echo "headers: $od"; echo "image: $bin"
          test -n "$od" && test -n "$bin"
          mkdir -p "$RUNNER_TEMP/board"
          cp "$(dirname "$od")"/canopen_slave_config.h "$od" "$RUNNER_TEMP/board/"
          cp "$bin" "$RUNNER_TEMP/board/flash.bin"
          elf=$(ls "$(dirname "$bin")"/*.elf 2>/dev/null | head -1 || true)
          if [ -n "$elf" ]; then cp "$elf" "$RUNNER_TEMP/board/firmware.elf"; fi
          truncate -s 4M "$RUNNER_TEMP/board/flash.bin"

      - name: Slave module on Linux, end to end on vcan1
        timeout-minutes: 5
        run: |
          b="$RUNNER_TEMP/board"; e=editor/resources/sources; c=$e/canopennode/src
          mkdir -p host && cd host
          for f in $(find "../$c" -name '*.c'); do gcc -c -O1 -I"../$c" -I"../$c/301" -I"../$c/305" "$f" -o "$(basename "$f" .c).o"; done
          g++ -std=gnu++17 -O1 -Wall -Wextra -Werror -DCANOPEN_SLAVE_HOST -I"$b" -I"../$e/arduino" -I"../$c" -I"../$c/301" -I"../$c/305" -c "../$e/arduino/canopen_slave.cpp" -o slave.o
          g++ -std=gnu++17 -O1 -Wall -Wextra -Werror -I"$b" -I"../$e/arduino" -c ../.github/board-slave/host_slave.cpp -o host.o
          g++ ./*.o -o host_slave
          cd ..
          candump -t d vcan1 > host-candump.log 2>&1 &
          ./host/host_slave vcan1 5020 > host.log 2>&1 &
          pid=$!
          set +e
          python3 .github/scripts/canopen_slave_e2e.py --interface vcan1 --board 127.0.0.1:5020
          rc=$?
          kill $pid
          echo "--- slave"; cat host.log
          if [ $rc -ne 0 ]; then echo "--- candump"; tail -60 host-candump.log; fi
          exit $rc

      - name: Firmware in QEMU, end to end on vcan0
        timeout-minutes: 8
        run: |
          b="$RUNNER_TEMP/board"
          candump -t d vcan0 > qemu-candump.log 2>&1 &
          ~/qemu/bin/qemu-system-xtensa -nographic -machine esp32 -m 4M -icount shift=3,align=off,sleep=on \
            -drive file="$b/flash.bin",if=mtd,format=raw \
            -object can-bus,id=canbus0 \
            -object can-host-socketcan,id=canhost0,if=vcan0,canbus=canbus0 \
            -global driver=esp32.twai,property=canbus,value=canbus0 \
            -chardev socket,id=uart0,host=127.0.0.1,port=5021,server=on,wait=off,logfile=serial.log \
            -serial chardev:uart0 -monitor none > qemu.log 2>&1 &
          qpid=$!
          set +e
          python3 .github/scripts/canopen_slave_e2e.py --interface vcan0 --board 127.0.0.1:5021
          rc=$?
          kill $qpid
          echo "--- qemu"; tail -20 qemu.log
          echo "--- serial"; tail -60 serial.log
          a2l=$(ls ~/.arduino15/packages/esp32/tools/esp-x32/*/bin/xtensa-esp32-elf-addr2line "$RUNNER_TEMP"/editor-data/*/packages/esp32/tools/esp-x32/*/bin/xtensa-esp32-elf-addr2line 2>/dev/null | head -1)
          bt=$(grep -o '0x4[0-9a-f]\{7\}' serial.log | sort -u | tr '\n' ' ')
          if [ -n "$bt" ] && [ -n "$a2l" ] && [ -f "$b/firmware.elf" ]; then echo "--- addr2line"; "$a2l" -pfiaC -e "$b/firmware.elf" $bt; fi
          echo "--- candump"; head -20 qemu-candump.log; echo ...; tail -40 qemu-candump.log
          exit $rc
