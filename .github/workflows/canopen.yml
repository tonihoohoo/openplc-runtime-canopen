name: CANopen

# The CANopen plugin, master and slave (core/src/drivers/plugins/native/canopen, docs/CANOPEN.md):
# its unit tests and the host tests on Lely's in-process bus, the master host test on a vcan link,
# and an end-to-end run of the runtime with projects uploaded by the OpenPLC Editor's command line.

on:
  pull_request:
  push:
    branches: [canopen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canopen-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_DIR: core/src/drivers/plugins/native/canopen
  EDITOR_REPOSITORY: tonihoohoo/openplc-editor-canopen

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.files.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Docs-only pull request
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/docs-only.sh

  plugin:
    name: Plugin build and tests
    needs: changes
    # Skipped (and so passing) only for a pull request that changes nothing but Markdown or docs/.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool

      - name: Build
        run: |
          cmake -S "$PLUGIN_DIR" -B "$PLUGIN_DIR/build" -DCANOPEN_BUILD_TESTS=ON
          cmake --build "$PLUGIN_DIR/build" -j"$(nproc)"

      - name: Unit and virtual bus tests
        run: ctest --test-dir "$PLUGIN_DIR/build" --output-on-failure

  vcan:
    name: Host test on vcan
    needs: changes
    # Skipped (and so passing) only for a pull request that changes nothing but Markdown or docs/.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    # Its kernel has a linux-modules-extra package with vcan.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: vcan0
        run: .github/scripts/vcan-up.sh vcan0

      - name: Dependencies
        run: sudo apt-get install -y --no-install-recommends autoconf automake libtool

      - name: Build
        run: |
          cmake -S "$PLUGIN_DIR" -B "$PLUGIN_DIR/build" -DCANOPEN_BUILD_TESTS=ON
          cmake --build "$PLUGIN_DIR/build" -j"$(nproc)"

      - name: Host test on vcan0
        run: CANOPEN_TEST_INTERFACE=vcan0 "$PLUGIN_DIR/build/tests/test_network"

      - name: LSS on vcan0
        run: CANOPEN_TEST_INTERFACE=vcan0 "$PLUGIN_DIR/build/tests/test_lss"

  e2e:
    name: End-to-end with the editor
    needs: changes
    # Skipped (and so passing) only for a pull request that changes nothing but Markdown or docs/.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: vcan0
        run: .github/scripts/vcan-up.sh vcan0

      - name: Editor branch
        id: editor
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/$EDITOR_REPOSITORY" "$BRANCH" >/dev/null; then
            ref="$BRANCH"
          else
            ref=canopen
          fi
          echo "Editor branch: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPOSITORY }}
          ref: ${{ steps.editor.outputs.ref }}
          path: editor

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install the runtime from source
        run: sudo ./install.sh --native

      - name: Simulated node
        run: |
          cmake -S "$PLUGIN_DIR" -B "$PLUGIN_DIR/build-sim" -DCANOPEN_BUILD_TESTS=ON
          cmake --build "$PLUGIN_DIR/build-sim" -j"$(nproc)" --target canopen_sim_slave

      # Production mode without minification, source maps or module concatenation: about a minute.
      - name: Build the editor
        working-directory: editor
        run: |
          npm ci --ignore-scripts
          npm run setup:strucpp
          node node_modules/electron/install.js
          flags='--no-optimization-minimize --no-devtool --no-optimization-concatenate-modules'
          npx concurrently --kill-others-on-fail --names main,renderer \
            "npm run build:main -- $flags" \
            "npm run build:renderer -- $flags"
          # Run from dist, the app looks for STruC++'s runtime headers next to main.js.
          mkdir -p release/app/dist/main/node_modules
          ln -sfn "$PWD/node_modules/strucpp" release/app/dist/main/node_modules/strucpp
          # A fresh profile needs the Arduino control files, or the board list never loads.
          mkdir -p "$RUNNER_TEMP/editor-data/User/Runtime"
          echo '[]' > "$RUNNER_TEMP/editor-data/User/Runtime/arduino-core-control.json"
          echo '[]' > "$RUNNER_TEMP/editor-data/User/Runtime/arduino-library-control.json"

      - name: Start the runtime
        run: |
          # install.sh starts the openplc-runtime service where systemd runs; start it by hand otherwise.
          if ! systemctl is-active --quiet openplc-runtime; then
            sudo bash -c './start_openplc.sh > /tmp/runtime.log 2>&1 &'
          fi
          for _ in $(seq 1 120); do
            if curl -ks -o /dev/null https://127.0.0.1:8443/; then exit 0; fi
            sleep 1
          done
          echo "::error::the runtime API did not come up"
          exit 1

      - name: The runtime reports CANopen support
        run: |
          curl -ks https://127.0.0.1:8443/api/capabilities | tee /dev/stderr \
            | python3 -c 'import json, sys; c = json.load(sys.stdin)["canopen"]; assert 12 in c["configVersions"] and {"status", "sdo", "nmt", "service", "lss", "slave_lss"} <= set(c["features"])'

      - name: Upload the project with the editor CLI
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-generic-io/project --host 127.0.0.1 --yes --create-user \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: Inputs reach the outputs through the program, and the status shows the nodes
        run: |
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 2 --steps 5 --timeout 180 --linger 30 &
          sim=$!
          token=$(curl -ks -X POST https://127.0.0.1:8443/api/login -H 'Content-Type: application/json' \
            -d '{"username": "ci", "password": "ci-canopen-e2e"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          # The simulated node may finish its steps and leave before a poll, so its boot event counts too.
          seen=
          for _ in $(seq 1 60); do
            if curl -ks -H "Authorization: Bearer $token" https://127.0.0.1:8443/api/canopen/status \
              | tee /tmp/canopen-status.json \
              | python3 -c 'import json, sys; n = json.load(sys.stdin)["networks"][0]; s = {x["node_id"]: x["state"] for x in n["nodes"]}; assert n["bus"]["state"] == "error_active" and s[2] == "operational" and s[9] == "absent" and n["all_mandatory_up"]' 2>/dev/null; then
              seen=1
              break
            fi
            sleep 1
          done
          cat /tmp/canopen-status.json
          wait "$sim"
          if [ -z "$seen" ]; then
            echo "::error::/api/canopen/status never reported node 2 operational and optional node 9 absent"
            exit 1
          fi

      - name: Online tools while the PLC runs and in service mode
        run: |
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 2 --steps 1 \
            --timeout 180 --linger 300 > "$RUNNER_TEMP/sim-online.log" 2>&1 &
          sim=$!
          status=0
          python3 .github/scripts/canopen_online_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0 || status=$?
          kill "$sim" 2>/dev/null || true
          wait "$sim" 2>/dev/null || true
          cat "$RUNNER_TEMP/sim-online.log"
          exit "$status"

      - name: LSS tools through the web API
        run: |
          # Node 2 runs; two devices without a node ID wait for one. Each keeps its LSS store in a file.
          sim="$PLUGIN_DIR/build-sim/tests/canopen_sim_slave"
          rm -f "$RUNNER_TEMP/lss-first" "$RUNNER_TEMP/lss-second"
          "$sim" --interface vcan0 --node 2 --steps 1 --timeout 180 --linger 300 \
            > "$RUNNER_TEMP/sim-lss-node2.log" 2>&1 &
          node2=$!
          "$sim" --interface vcan0 --node 255 --lss-serial 0x5678 --steps 0 --linger 300 \
            --lss-store "$RUNNER_TEMP/lss-first" > "$RUNNER_TEMP/sim-lss-first.log" 2>&1 &
          first=$!
          "$sim" --interface vcan0 --node 255 --lss-serial 0x5679 --steps 0 --linger 300 \
            --lss-store "$RUNNER_TEMP/lss-second" > "$RUNNER_TEMP/sim-lss-second.log" 2>&1 &
          second=$!
          status=0
          python3 .github/scripts/canopen_lss_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0 || status=$?
          kill "$node2" "$first" "$second" 2>/dev/null || true
          wait 2>/dev/null || true
          if [ "$status" -eq 0 ]; then
            # The first device stored node ID 4; the second takes 125 kbit/s at its next start.
            grep -q '^4 ' "$RUNNER_TEMP/lss-first" || { echo "::error::node ID 4 not stored"; status=1; }
            timeout 10 "$sim" --interface vcan0 --node 255 --lss-serial 0x5679 --steps 0 \
              --lss-store "$RUNNER_TEMP/lss-second" > "$RUNNER_TEMP/sim-lss-restart.log" 2>&1 || true
            grep -q 'bit rate from the store: 125000' "$RUNNER_TEMP/sim-lss-restart.log" \
              || { echo "::error::the bit rate was not taken at the restart"; status=1; }
          fi
          for f in node2 first second restart; do
            echo "== sim-lss-$f"; cat "$RUNNER_TEMP/sim-lss-$f.log" 2>/dev/null || true
          done
          exit "$status"
      - name: LSS search ended by a device answering out of turn
        run: |
          sim="$PLUGIN_DIR/build-sim/tests/canopen_sim_slave"
          "$sim" --interface vcan0 --node 2 --steps 1 --timeout 120 --linger 200 \
            > "$RUNNER_TEMP/sim-oot-node2.log" 2>&1 &
          node2=$!
          python3 .github/scripts/lss_out_of_turn_device.py --interface vcan0 --serial 0x1234 \
            --seconds 200 > "$RUNNER_TEMP/sim-oot-device.log" 2>&1 &
          device=$!
          "$sim" --interface vcan0 --node 255 --lss-serial 0x5679 --steps 0 --linger 200 \
            > "$RUNNER_TEMP/sim-oot-other.log" 2>&1 &
          other=$!
          status=0
          python3 .github/scripts/canopen_lss_out_of_turn_e2e.py --user ci \
            --password ci-canopen-e2e || status=$?
          kill "$node2" "$device" "$other" 2>/dev/null || true
          wait 2>/dev/null || true
          for f in node2 device other; do
            echo "== sim-oot-$f"; cat "$RUNNER_TEMP/sim-oot-$f.log" 2>/dev/null || true
          done
          exit "$status"

      - name: Upload the PLC function block project with the editor CLI
        id: blocks
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without the block library has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-plc-blocks/project ]; then
            echo "::notice::The editor branch has no PLC function block project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-plc-blocks/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json

      - name: PLC function blocks against the simulated node, across PLC stops and starts
        if: steps.blocks.outputs.present == 'true'
        run: |
          python3 .github/scripts/canopen_blocks_e2e.py --sim "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" \
            --interface vcan0 --user ci --password ci-canopen-e2e

      - name: Upload the boot SDO project with the editor CLI
        id: boot
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without the boot SDO options has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-boot-sdo/project ]; then
            echo "::notice::The editor branch has no boot SDO project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-boot-sdo/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: A refused startup SDO with continue, a gap and an RPDO deadline
        if: steps.boot.outputs.present == 'true'
        run: |
          # The node refuses its 0x2100 write; the boot goes on. Its outputs follow through the gap,
          # and the master sends them again while they stay the same.
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 2 --steps 3 \
            --parameter-read-only 1 --expect-resends 10 --timeout 180 --linger 30 \
            > "$RUNNER_TEMP/sim-boot.log" 2>&1 &
          sim=$!
          token=$(curl -ks -X POST https://127.0.0.1:8443/api/login -H 'Content-Type: application/json' \
            -d '{"username": "ci", "password": "ci-canopen-e2e"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          seen=
          for _ in $(seq 1 60); do
            if curl -ks -H "Authorization: Bearer $token" https://127.0.0.1:8443/api/canopen/status \
              | tee /tmp/canopen-boot-status.json \
              | python3 -c 'import json, sys; n = [x for x in json.load(sys.stdin)["networks"][0]["nodes"] if x["node_id"] == 2][0]; assert n["state"] == "operational" and [k["index"] for k in n["sdo_skipped"]] == [0x2100]' 2>/dev/null; then
              seen=1
              break
            fi
            sleep 1
          done
          cat /tmp/canopen-boot-status.json
          status=0
          wait "$sim" || status=$?
          cat "$RUNNER_TEMP/sim-boot.log"
          if [ -z "$seen" ]; then
            echo "::error::/api/canopen/status never reported node 2 operational with its 0x2100 write refused"
            exit 1
          fi
          exit "$status"

      - name: Upload the node control project with the editor CLI
        id: control
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without node control has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-node-control/project ]; then
            echo "::notice::The editor branch has no node control project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-node-control/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: The program turns a node on, waits for the mandatory nodes and starts a node
        if: steps.control.outputs.present == 'true'
        run: |
          # Node 3 is off at PLC start and node 2 waits for the program's start: the program turns
          # node 3 on, and once every mandatory node is up starts node 2 and copies its inputs to
          # its outputs, which the simulated node 2 checks.
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 3 --steps 0 \
            --timeout 180 --linger 90 > "$RUNNER_TEMP/sim-control3.log" 2>&1 &
          sim3=$!
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 2 --steps 3 \
            --timeout 180 --linger 30 > "$RUNNER_TEMP/sim-control2.log" 2>&1 &
          sim2=$!
          token=$(curl -ks -X POST https://127.0.0.1:8443/api/login -H 'Content-Type: application/json' \
            -d '{"username": "ci", "password": "ci-canopen-e2e"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          seen=
          for _ in $(seq 1 90); do
            if curl -ks -H "Authorization: Bearer $token" https://127.0.0.1:8443/api/canopen/status \
              | tee /tmp/canopen-control-status.json \
              | python3 -c 'import json, sys; n = json.load(sys.stdin)["networks"][0]; s = {x["node_id"]: x for x in n["nodes"]}; assert s[2]["start"] == "program" and s[2]["state"] == "operational" and s[3]["enabled"] and s[3]["state"] == "operational" and n["all_mandatory_up"] and any(e["kind"] == "node_on" and e["node"] == 3 for e in n["events"])' 2>/dev/null; then
              seen=1
              break
            fi
            sleep 1
          done
          cat /tmp/canopen-control-status.json
          status=0
          wait "$sim2" || status=$?
          kill "$sim3" 2>/dev/null || true
          wait "$sim3" 2>/dev/null || true
          cat "$RUNNER_TEMP/sim-control2.log" "$RUNNER_TEMP/sim-control3.log"
          if [ -z "$seen" ]; then
            echo "::error::/api/canopen/status never reported node 3 turned on and node 2 started by the program"
            exit 1
          fi
          exit "$status"

      - name: Upload the slave project with the editor CLI
        id: slave
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without the CANopen slave has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-slave/project ]; then
            echo "::notice::The editor branch has no CANopen slave project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-slave/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: The runtime as a CANopen slave under a host master
        if: steps.slave.outputs.present == 'true'
        run: |
          python3 .github/scripts/canopen_slave_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0

      - name: Upload the slave blocks project with the editor CLI
        id: slaveblocks
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without the slave blocks has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-slave-blocks/project ]; then
            echo "::notice::The editor branch has no slave blocks project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-slave-blocks/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: The PLC program controls the slave through its blocks
        if: steps.slaveblocks.outputs.present == 'true'
        run: |
          python3 .github/scripts/canopen_slave_blocks_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0

      - name: Upload the LSS project with the editor CLI
        id: lss
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without node IDs over LSS has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-lss/project ]; then
            echo "::notice::The editor branch has no LSS project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-lss/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: A node without a node ID gets it over LSS and boots
        if: steps.lss.outputs.present == 'true'
        run: |
          # The simulated node starts without a node ID; the master finds it by its LSS address,
          # gives it node ID 2, stores it once and boots it; its inputs then reach its outputs.
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 255 \
            --lss-serial 0x1001 --expect-lss-stores 1 --steps 3 --timeout 180 --linger 30 \
            > "$RUNNER_TEMP/sim-lss.log" 2>&1 &
          sim=$!
          token=$(curl -ks -X POST https://127.0.0.1:8443/api/login -H 'Content-Type: application/json' \
            -d '{"username": "ci", "password": "ci-canopen-e2e"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          seen=
          for _ in $(seq 1 90); do
            if curl -ks -H "Authorization: Bearer $token" https://127.0.0.1:8443/api/canopen/status \
              | tee /tmp/canopen-lss-status.json \
              | python3 -c 'import json, sys; n = [x for x in json.load(sys.stdin)["networks"][0]["nodes"] if x["node_id"] == 2][0]; assert n["state"] == "operational" and n["lss"]["result"] == "given" and n["lss"]["previous_id"] == 255 and n["lss"]["stored"]' 2>/dev/null; then
              seen=1
              break
            fi
            sleep 1
          done
          cat /tmp/canopen-lss-status.json
          status=0
          wait "$sim" || status=$?
          cat "$RUNNER_TEMP/sim-lss.log"
          if [ -z "$seen" ]; then
            echo "::error::/api/canopen/status never reported node 2 given its node ID over LSS and operational"
            exit 1
          fi
          exit "$status"

      - name: Upload the slave LSS project with the editor CLI
        id: slave_lss
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without LSS in the slave has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/canopen-slave-lss/project ]; then
            echo "::notice::The editor branch has no slave LSS project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-slave-lss/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json
          sudo cat ../build/plugins/canopen.json

      - name: LSS in the slave under a host LSS master
        if: steps.slave_lss.outputs.present == 'true'
        run: |
          python3 .github/scripts/canopen_slave_lss_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0

      - name: GPIO simulator lines for the Linux I/O blocks
        id: gpiosim
        run: .github/scripts/gpio-sim-up.sh

      - name: Upload the Linux I/O project with the editor CLI
        id: linuxio
        if: steps.gpiosim.outputs.ready == 'true'
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # An editor branch without the linux_io blocks has no such project; the check is skipped.
          if [ ! -d ./e2e/fixtures/linux-io/project ]; then
            echo "::notice::The editor branch has no Linux I/O project; skipped"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/linux-io/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json

      - name: The Linux I/O blocks on simulated GPIO lines
        if: steps.linuxio.outputs.present == 'true'
        run: |
          sudo python3 .github/scripts/linux_io_e2e.py --user ci --password ci-canopen-e2e \
            --interface vcan0 --sim "${{ steps.gpiosim.outputs.sysfs }}"

      - name: Upload the first project again
        if: >-
          steps.control.outputs.present == 'true' || steps.slave.outputs.present == 'true' ||
          steps.lss.outputs.present == 'true' || steps.slave_lss.outputs.present == 'true' ||
          steps.linuxio.outputs.present == 'true'
        working-directory: editor
        env:
          OPENPLC_CREDENTIALS: ci:ci-canopen-e2e
        run: |
          # The next check needs the first project's watch of the master's heartbeat.
          npx electron --no-sandbox ./release/app/dist/main/main.js --cli upload \
            ./e2e/fixtures/canopen-generic-io/project --host 127.0.0.1 --yes \
            --user-data "$RUNNER_TEMP/editor-data" --json

      - name: The node goes pre-operational when the runtime dies
        run: |
          # The project's node watches the master's heartbeat (0x1016); no NMT command is sent.
          "$PLUGIN_DIR/build-sim/tests/canopen_sim_slave" --interface vcan0 --node 2 --steps 1 \
            --timeout 180 --expect-master-loss 5 > "$RUNNER_TEMP/sim.log" 2>&1 &
          sim=$!
          timeout 180 bash -c "until grep -q 'watching the master' '$RUNNER_TEMP/sim.log'; do sleep 0.5; done" \
            || { cat "$RUNNER_TEMP/sim.log"; exit 1; }
          sudo pkill -KILL -x plc_main
          status=0
          wait "$sim" || status=$?
          cat "$RUNNER_TEMP/sim.log"
          exit "$status"

      - name: Runtime log
        if: always()
        run: |
          sudo journalctl -u openplc-runtime --no-pager || true
          sudo cat /tmp/runtime.log || true
