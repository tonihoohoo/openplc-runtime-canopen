name: CANopen release

# Publishes a release of this fork (docs/CANOPEN_RELEASES.md): the runtime image
# ghcr.io/<owner>/openplc-runtime:<tag> for linux/arm64 and linux/amd64, `latest`,
# and a GitHub Release. Started by a v<x.y.z>-canopen.<N> tag on canopen, or by
# hand on canopen, where the next N is picked and the tag created here. A pull request that
# changes the release files runs it as a dry run: built, nothing published.

on:
  push:
    tags: ['v*-canopen.*']
  pull_request:
    paths:
      - '.github/workflows/canopen-release.yml'
      - '.github/scripts/canopen_release.py'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (Markdown), shown above the list of changes'
        required: false
        type: string
      version:
        description: 'Tag to create, e.g. v4.3.1-canopen.2 (empty: the next one)'
        required: false
        type: string
      dry_run:
        description: 'Build only: no tag, no image push, no release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canopen-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/openplc-runtime
  PLUGIN_DIR: core/src/drivers/plugins/native/canopen
  DRY_RUN: ${{ inputs.dry_run == true || github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Resolve the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
      lely: ${{ steps.lely.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Tag, commit and checks
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          git fetch --quiet --tags origin canopen main
          dry=; if [ "$DRY_RUN" = "true" ]; then dry=--dry-run; fi
          python3 .github/scripts/canopen_release.py resolve $dry \
            --base-file VERSION --event "$GITHUB_EVENT_NAME" --ref-name "$GITHUB_REF_NAME" \
            --version "$VERSION_INPUT" --require-workflow canopen.yml \
            --product "OpenPLC Runtime" --notes "$NOTES" \
            --note "Install: see the CANopen section of the README. The image is ${IMAGE}." \
            --notes-out "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Banned words in the notes
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
        run: python3 .github/scripts/check-banned-words.py --require-list --message-file "$RUNNER_TEMP/release-notes.md"

      - name: CAN library commit
        id: lely
        run: echo "commit=$(sed -n 's/.*LELY_GIT_TAG "\([0-9a-f]*\)".*/\1/p' "$PLUGIN_DIR/CMakeLists.txt")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # The plugin's CMake uses a CAN library prefix in its lely-prefix/ directory when present,
      # so the image build skips the library's own build. Built in the image's base OS.
      - name: Cached CAN library
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PLUGIN_DIR }}/lely-prefix
          key: lely-${{ needs.prepare.outputs.lely }}-bookworm-${{ matrix.arch }}

      - name: Build the CAN library
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LELY: ${{ needs.prepare.outputs.lely }}
        run: |
          docker run --rm -v "$PWD/$PLUGIN_DIR:/plugin" -e LELY debian:bookworm-slim bash -euc '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends autoconf automake libtool make g++ git ca-certificates >/dev/null
            git clone --quiet https://gitlab.com/lely_industries/lely-core.git /lely
            cd /lely && git checkout --quiet "$LELY"
            autoreconf -i >/dev/null
            ./configure --quiet --prefix=/plugin/lely-prefix --disable-shared --enable-static --with-pic \
              --disable-python --disable-tests --disable-unit-tests --disable-tools \
              --disable-daemon --disable-gw --disable-gw-txt CPPFLAGS=-DNDEBUG
            make -j"$(nproc)" >/dev/null && make install >/dev/null
            mkdir -p /plugin/lely-prefix/share/licenses/lely-core
            cp LICENSE NOTICE /plugin/lely-prefix/share/licenses/lely-core/
            chmod -R a+rX /plugin/lely-prefix'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            RUNTIME_VERSION=${{ needs.prepare.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          outputs: ${{ env.DRY_RUN == 'true' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,scope=runtime-${{ matrix.arch }},mode=max

      - name: Digest
        if: env.DRY_RUN != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.DRY_RUN != 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  publish:
    name: Tag the image and publish the release
    needs: [prepare, image]
    if: inputs.dry_run != true && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Multi-arch tag and latest
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$TAG"
          for arch in arm64 amd64; do
            docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | grep -q "\"architecture\":\"$arch\"" \
              || { echo "::error::$IMAGE:$TAG has no $arch image"; exit 1; }
          done

      # Created only now, when the image exists, so a failed build leaves no tag behind.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.prepare.outputs.create_tag == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Create the tag
        if: needs.prepare.outputs.create_tag == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenPLC Runtime ${TAG#v} (CANopen fork)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
